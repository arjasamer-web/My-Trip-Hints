<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyTripHints admin panel">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyTripHints Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>MyTripHints Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F4F7FC; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #14307A; }
    #splash .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #14307A, #1E44A8 55%, #1FB2D5); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #E4ECFF; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #1E44A8; animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash"><div class="mark"></div><div>MyTripHints Admin</div><div class="bar"><i></i></div></div>
  <script>
    // Editors set window.mthDirty = true while a form has unsaved changes.
    window.mthDirty = false;
    window.addEventListener('beforeunload', function (e) { if (window.mthDirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('splash'); if (s) s.remove(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
