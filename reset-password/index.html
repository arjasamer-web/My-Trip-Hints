<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MyTripHints – Set a new password</title>
  <style>
    :root {
      --bg: #F4F7FC;
      --card: #FFFFFF;
      --text: #14213D;
      --muted: #5B6478;
      --brand: #1E44A8;
      --line: #D7DEEB;
      --error-bg: #FBEAE8;
      --error: #B3261E;
      --ok-bg: #E6F4EC;
      --ok: #1B7F4B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(20, 33, 61, 0.06);
    }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { color: var(--brand); font-weight: bold; font-size: 22px; }
    .lang button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); font-weight: bold; }
    h1 { font-size: 18px; margin: 20px 0 6px; }
    p { margin: 0; font-size: 15px; line-height: 1.5; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 8px; }
    label { display: block; font-size: 14px; font-weight: bold; margin: 16px 0 6px; }
    input {
      width: 100%;
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #FFFFFF;
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    .primary {
      width: 100%;
      margin-top: 20px;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary[disabled] { opacity: 0.6; cursor: default; }
    .message { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .message.error { background: var(--error-bg); color: var(--error); }
    .message.ok { background: var(--ok-bg); color: var(--ok); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="brand">MyTripHints</div>
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      </div>
    </div>

    <section id="form-view">
      <h1 data-i18n="title"></h1>
      <p data-i18n="body"></p>
      <form id="form" novalidate>
        <label for="password" data-i18n="newPassword"></label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm" data-i18n="confirmPassword"></label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        <p class="muted" data-i18n="rule"></p>
        <div id="message" class="message" aria-live="polite" hidden></div>
        <button class="primary" id="submit" type="submit" data-i18n="update"></button>
      </form>
    </section>

    <section id="done-view" hidden>
      <h1 data-i18n="doneTitle"></h1>
      <p data-i18n="doneBody"></p>
    </section>

    <section id="invalid-view" hidden>
      <h1 data-i18n="invalidTitle"></h1>
      <p data-i18n="invalidBody"></p>
    </section>

    <noscript>
      <p>This page needs JavaScript to set your password. Please enable it and reload.</p>
      <p dir="rtl">تحتاج هذه الصفحة إلى JavaScript لتعيين كلمة المرور. يرجى تفعيله وإعادة التحميل.</p>
    </noscript>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script>
    (function () {
      'use strict';

      // The client's Supabase project. Both values are public by design: the
      // same ones ship inside the apps (see app_config.dart in each project).
      var SUPABASE_URL = 'https://fqlixqmxtmtnvkfxaizf.supabase.co';
      var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_d8fwPeG0hkvhtdvcXhnEpQ_xmFuwkFX';

      // Same wording as the app's strings (lib/l10n/app_en.arb, app_ar.arb).
      var STRINGS = {
        en: {
          title: 'Set a new password',
          body: 'Choose a new password for your MyTripHints account.',
          newPassword: 'New password',
          confirmPassword: 'Confirm password',
          rule: 'At least 8 characters, including a number.',
          update: 'Update password',
          working: 'Updating…',
          errorShort: 'Password must be at least 8 characters',
          errorNumber: 'Password must contain a number',
          errorMismatch: 'Passwords do not match',
          errorSame: 'Choose a password you have not used before.',
          errorWeak: 'This password is too easy to guess. Choose a longer one with a number.',
          errorGeneric: 'Something went wrong. Check your connection and try again.',
          doneTitle: 'Your password has been updated.',
          doneBody: 'You can now sign in to the MyTripHints app with your new password. You can close this page.',
          invalidTitle: 'This reset link has expired. Please request a new one.',
          invalidBody: 'Open the MyTripHints app, tap "Forgot password?" and request a new link. A link works once and expires after one hour.'
        },
        ar: {
          title: 'تعيين كلمة مرور جديدة',
          body: 'اختر كلمة مرور جديدة لحسابك في MyTripHints.',
          newPassword: 'كلمة المرور الجديدة',
          confirmPassword: 'تأكيد كلمة المرور',
          rule: '8 أحرف على الأقل، مع رقم واحد.',
          update: 'تحديث كلمة المرور',
          working: 'جارٍ التحديث…',
          errorShort: 'يجب أن تتكون كلمة المرور من 8 أحرف على الأقل',
          errorNumber: 'يجب أن تحتوي كلمة المرور على رقم',
          errorMismatch: 'كلمتا المرور غير متطابقتين',
          errorSame: 'اختر كلمة مرور لم تستخدمها من قبل.',
          errorWeak: 'كلمة المرور سهلة التخمين. اختر كلمة أطول تحتوي على رقم.',
          errorGeneric: 'حدث خطأ ما. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.',
          doneTitle: 'تم تحديث كلمة المرور.',
          doneBody: 'يمكنك الآن تسجيل الدخول إلى تطبيق MyTripHints بكلمة المرور الجديدة. يمكنك إغلاق هذه الصفحة.',
          invalidTitle: 'انتهت صلاحية رابط إعادة التعيين. يرجى طلب رابط جديد.',
          invalidBody: 'افتح تطبيق MyTripHints، واضغط على "هل نسيت كلمة المرور؟" واطلب رابطًا جديدًا. يعمل الرابط مرة واحدة وتنتهي صلاحيته خلال ساعة.'
        }
      };

      var form = document.getElementById('form');
      var passwordInput = document.getElementById('password');
      var confirmInput = document.getElementById('confirm');
      var submitButton = document.getElementById('submit');
      var messageBox = document.getElementById('message');

      var lang = 'en';
      var messageKey = null;
      var messageKind = null;
      var busy = false;

      function text(key) { return STRINGS[lang][key]; }

      function applyLanguage(next) {
        lang = STRINGS[next] ? next : 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = 'MyTripHints – ' + text('title');
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].textContent = text(nodes[i].getAttribute('data-i18n'));
        }
        var buttons = document.querySelectorAll('[data-lang]');
        for (var j = 0; j < buttons.length; j++) {
          buttons[j].setAttribute('aria-pressed', String(buttons[j].getAttribute('data-lang') === lang));
        }
        if (busy) submitButton.textContent = text('working');
        if (messageKey) showMessage(messageKey, messageKind);
      }

      function showMessage(key, kind) {
        messageKey = key;
        messageKind = kind;
        messageBox.textContent = text(key);
        messageBox.className = 'message ' + kind;
        messageBox.hidden = false;
      }

      function clearMessage() {
        messageKey = null;
        messageKind = null;
        messageBox.hidden = true;
      }

      function showView(id) {
        var views = ['form-view', 'done-view', 'invalid-view'];
        for (var i = 0; i < views.length; i++) {
          document.getElementById(views[i]).hidden = views[i] !== id;
        }
      }

      function setBusy(value) {
        busy = value;
        submitButton.disabled = value;
        submitButton.textContent = text(value ? 'working' : 'update');
      }

      function messageKeyFor(error) {
        var code = error && error.code ? error.code : '';
        var message = error && error.message ? error.message : '';
        if (code === 'same_password' || /different from the old/i.test(message)) return 'errorSame';
        if (code === 'weak_password') return 'errorWeak';
        return 'errorGeneric';
      }

      // The e-mail link carries a one-time token hash. Read it once, then take
      // it out of the address bar so it never lands in history or a screenshot.
      var params = new URLSearchParams(window.location.search);
      var tokenHash = params.get('token_hash');
      var linkFailed = params.get('error') !== null || params.get('error_code') !== null;
      var requestedLang = params.get('lang');
      if (window.location.search) {
        window.history.replaceState(null, '', window.location.pathname);
      }

      var browserLang = (navigator.language || '').toLowerCase();
      applyLanguage(requestedLang || (browserLang.indexOf('ar') === 0 ? 'ar' : 'en'));

      var langButtons = document.querySelectorAll('[data-lang]');
      for (var k = 0; k < langButtons.length; k++) {
        langButtons[k].addEventListener('click', function (event) {
          applyLanguage(event.currentTarget.getAttribute('data-lang'));
        });
      }

      if (!tokenHash || linkFailed) {
        showView('invalid-view');
        return;
      }

      var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });

      // The token works once. After it is verified the session lives in memory
      // only, so a rejected password can be retried without a new link.
      var verified = false;

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (busy) return;
        clearMessage();

        var password = passwordInput.value;
        if (password.length < 8) { showMessage('errorShort', 'error'); return; }
        if (!/\d/.test(password)) { showMessage('errorNumber', 'error'); return; }
        if (password !== confirmInput.value) { showMessage('errorMismatch', 'error'); return; }

        setBusy(true);
        var verify = verified
          ? Promise.resolve({ error: null })
          : client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });

        verify.then(function (result) {
          if (result.error) {
            showView('invalid-view');
            return null;
          }
          verified = true;
          return client.auth.updateUser({ password: password }).then(function (updated) {
            if (updated.error) {
              showMessage(messageKeyFor(updated.error), 'error');
              return null;
            }
            showView('done-view');
            return client.auth.signOut({ scope: 'local' }).catch(function () {});
          });
        }).catch(function () {
          showMessage('errorGeneric', 'error');
        }).then(function () {
          setBusy(false);
        });
      });
    })();
  </script>
</body>
</html>
